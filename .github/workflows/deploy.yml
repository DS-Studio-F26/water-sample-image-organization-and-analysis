# Deploys the image Worker (ProjectCode/worker/) to Cloudflare.
#
#   push to `host`   -> deploys the Worker, but only when ProjectCode/worker/ changed
#   Run workflow     -> deploys the Worker now
#   (Actions tab)
#
# The dashboard is NOT deployed here: the Cloudflare Pages project
# "water-sample-dashboard" is connected to this repository and builds every
# push to `host` itself (root directory ProjectCode, build command
# "node build.mjs", output directory dist).
#
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# See the README section "Hosting (Plan A)".
name: Deploy image Worker

on:
  push:
    branches: [host]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits for the running one to finish.
concurrency:
  group: cloudflare-worker-deploy
  cancel-in-progress: false

env:
  WRANGLER_VERSION: "4.145.0"  # keep in step with ProjectCode/worker/package.json

jobs:
  changes:
    name: Did the Worker change?
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.diff.outputs.worker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            worker=true  # run by hand: always deploy
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            worker=true  # first push of the branch, or rewritten history: deploy to be safe
          elif git diff --quiet "$BEFORE" "$AFTER" -- ProjectCode/worker; then
            worker=false
          else
            worker=true
          fi
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
          echo "Deploy the Worker: $worker"

  worker:
    name: Image Worker -> Cloudflare Workers
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Deploy the Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: ProjectCode/worker
          command: deploy
